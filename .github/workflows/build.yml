name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Standard public-repository runners only. Never switch to a paid runner.
    if: github.event.repository.private == false
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, platform: windows-x64}
          - {os: ubuntu-24.04, platform: linux-x64}
          - {os: macos-15, platform: macos-arm64}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, MIT
        with:
          persist-credentials: false
      - name: Documentation and whitespace guards
        run: |
          ./tools/check-docs.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          ./tools/check-package-provenance.ps1
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev xvfb xauth
      - name: Configure
        run: |
          $options = @('-S', '.', '-B', 'build/ci', '-DCMAKE_BUILD_TYPE=Release', '-DBUILD_TESTING=ON')
          if ($IsWindows) { $options += @('-G', 'Visual Studio 17 2022', '-A', 'x64') }
          if ($IsMacOS) { $options += @('-DCMAKE_OSX_ARCHITECTURES=arm64', '-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0') }
          cmake @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build/ci --config Release --parallel 2
      - name: Linux native editor preflight
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ctest --test-dir build/ci -C Release -R '^processor_state_editor$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: CTest
        run: |
          if ($IsLinux) { xvfb-run -a ctest --test-dir build/ci -C Release --output-on-failure }
          else { ctest --test-dir build/ci -C Release --output-on-failure }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows pluginval strictness 5
        if: runner.os == 'Windows'
        run: |
          pwsh -NoProfile -File ./tools/setup-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./tools/check-plugin.ps1 -PluginPath build/ci/Ironstack_artefacts/Release/VST3/Ironstack.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record build environment
        run: |
          "Runner: $env:RUNNER_OS $env:RUNNER_ARCH; image: $env:ImageOS $env:ImageVersion" | Set-Content build/ci/ci-environment.txt
          cmake --version | Add-Content build/ci/ci-environment.txt
          if ($IsLinux) {
            uname -a | Add-Content build/ci/ci-environment.txt
            dpkg-query -W | Add-Content build/ci/ci-environment.txt
          }
          if ($IsMacOS) {
            sw_vers | Add-Content build/ci/ci-environment.txt
            xcodebuild -version | Add-Content build/ci/ci-environment.txt
          }
      - name: Reject stale or invalid render evidence
        run: ./tools/check-render-provenance.ps1 -BuildDirectory build/ci
      - name: Package instruments, renderer and regression evidence
        run: ./tools/package.ps1 -BuildDirectory build/ci -Platform '${{ matrix.platform }}'
      - name: Verify packaged payloads and extracted renderer
        run: ./tools/check-render-package.ps1 -BuildDirectory build/ci -Platform '${{ matrix.platform }}'
      - name: Upload compiled package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT
        with:
          name: Ironstack-${{ matrix.platform }}-${{ github.sha }}
          path: |
            build/ci/packages/*
            build/ci/package-verification.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
